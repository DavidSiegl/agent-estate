# The per-repo agent setup: docs/agents/ (imported into CLAUDE.md), the tracker, the
# cross-review push gate and a quality gate (octoflow-ai's for Python, or the repo's own
# for any language), run in CI (Jenkins or GitHub Actions) with optional auto-merge and
# releases. README.md says how to apply and update it.

_subdirectory: template
_min_copier_version: "9.0"

# A repo-owned gate is the repo's from its first render: scripts/gate is a starter that
# `copier update` never overwrites. octoflow-ai's gate stays the template's.
_skip_if_exists:
  - "{% if gate == 'own' %}scripts/gate{% endif %}"

# Post-copy and post-update steps that are not template files: they edit files the repo
# already owns (.gitignore, CLAUDE.md, pyproject.toml) and set state outside the tree.
# init/apply.py documents each; it is idempotent, so `copier update` reruns it.
_tasks:
  - command:
      - python3
      - "{{ _copier_conf.src_path }}/init/apply.py"
      - "--repo={{ repo }}"
      - "--tracker={{ tracker }}"
      - "--ticket-sync={{ ticket_sync }}"
      - "--review-gate={{ review_gate }}"
      - "--gate={{ gate }}"
      - "--python-package={{ python_package if gate == 'python' else '' }}"
      - "--automerge={{ automerge }}"

repo:
  type: str
  help: GitHub repo the issues live on, as owner/name
  validator: "{% if repo.count('/') != 1 or repo.startswith('/') or repo.endswith('/') %}Give owner/name{% endif %}"

tracker:
  type: str
  help: Where specs and tickets live
  choices:
    Files under .scratch/ (scratch-issue-tracker skill): scratch
    GitHub Issues, through gh: github
  default: scratch

ticket_sync:
  type: bool
  help: Mirror .scratch/ tickets two-way to GitHub issues on that repo? (publishes every open ticket)
  default: false
  when: "{{ tracker == 'scratch' }}"

review_gate:
  type: bool
  help: Refuse Claude's pushes of commits without a passing cross-review record?
  default: true

# Replaces the yes/no python_gate: its default takes a repo's old answer, which `copier
# update` still passes to the new question's default, so such a repo needs no -d.
gate:
  type: str
  help: The quality gate scripts/gate runs on a change
  choices:
    octoflow-ai's, for a Python project run by uv: python
    The repo's own, for any language (a starter scripts/gate to fill in): own
    None: none
  default: "{{ 'python' if python_gate | default(false) else 'none' }}"

python_package:
  type: str
  help: Import name of the package the gate measures coverage of and mutates
  when: "{{ gate == 'python' }}"
  validator: "{% if gate == 'python' and not python_package.isidentifier() %}Give an importable name{% endif %}"

ci:
  type: str
  help: Where the quality gate runs on pull requests
  choices:
    Nowhere - locally only: none
    Jenkins (multibranch job, GitHub App status): jenkins
    GitHub Actions: github-actions
  default: none
  when: "{{ gate != 'none' }}"

jenkins_agent_label:
  type: str
  help: Label of the Jenkins agents that may run code agents wrote
  default: untrusted
  when: "{{ ci == 'jenkins' }}"

jenkins_status_login:
  type: str
  help: GitHub login Jenkins's GitHub App posts statuses as ("<app-slug>[bot]")
  default: davidsiegl-jenkins[bot]
  when: "{{ ci == 'jenkins' }}"
  validator: "{% if ci == 'jenkins' and not jenkins_status_login.endswith('[bot]') %}An App posts as <slug>[bot]{% endif %}"

jenkins_notify_email:
  type: str
  help: Address Jenkins mails when a build fails and when one passes after a failure (empty for no mail)
  default: ""
  when: "{{ ci == 'jenkins' }}"
  validator: "{% if ci == 'jenkins' and jenkins_notify_email and '@' not in jenkins_notify_email %}Give an email address, or leave it empty{% endif %}"

automerge:
  type: bool
  help: Merge a pull request into main automatically once CI passes on its head?
  default: false
  when: "{{ ci != 'none' }}"

release:
  type: bool
  help: Release every merge into main that raises the version, as a GitHub release (scripts/release)?
  default: false
  when: "{{ ci != 'none' }}"
  validator: "{% if release and ci == 'none' %}Releases need ci{% endif %}"

jenkins_release_credential:
  type: str
  help: Jenkins string credential holding a GitHub token that may create releases on the repo
  default: GitHub-Agents
  when: "{{ release and ci == 'jenkins' }}"
